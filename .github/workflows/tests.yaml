name: Integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ["0.13.366", "0.13.372"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component==${{ matrix.plugin }} ruff==0.15.14
      - run: python tests/install_dependencies.py
      - run: ruff check --no-cache .
      - run: ruff format --check --no-cache .
      - run: pytest tests/ha -q
