feed:
  system: true
  is_advanced: true
  description: >-
    Dispense portions immediately. Non-blocking by default (returns the
    device's near-instant ACK); set wait to block until the dispense
    completes.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: asf02
    portions:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 99
          mode: box
          step: 1
    wait:
      required: false
      default: false
      selector:
        boolean:
stop:
  system: true
  is_advanced: true
  description: >-
    Stop an in-progress dispense. Safe no-op when the feeder is idle;
    cancels before any portion counts.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: asf02
set_schedule:
  system: true
  is_advanced: true
  description: >-
    Replace the entire 10-slot schedule. The write response (the
    device-confirmed slot array) is the authoritative confirmation.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: asf02
    entries:
      required: true
      selector:
        repeat:
          max: 10
          fields:
            time:
              required: true
              selector:
                time:
            portion:
              required: true
              selector:
                number:
                  min: 1
                  max: 9
                  mode: box
                  step: 1
            enabled:
              required: false
              default: true
              selector:
                boolean:
clear_schedule:
  system: true
  is_advanced: true
  description: Remove all schedule entries.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: asf02
