feed:
  system: true
  is_advanced: true
  description: >-
    Dispense portions immediately. Non-blocking by default (returns the
    device's near-instant ACK); set wait to block until the dispense
    completes.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: asf02
    portions:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 99
          mode: box
          step: 1
    wait:
      required: false
      default: false
      selector:
        boolean:
stop:
  system: true
  is_advanced: true
  description: >-
    Stop an in-progress dispense. Safe no-op when the feeder is idle;
    cancels before any portion counts.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: asf02
set_schedule:
  system: true
  is_advanced: true
  description: >-
    Replace the entire 10-slot schedule. The write response (the
    device-confirmed slot array) is the authoritative confirmation.
    Requires `entries`: a list of up to 10 objects, each with `time`
    ("HH:MM"), `portion` (1-9), and optional `enabled` (bool). This field
    is best supplied from a script or automation, e.g.
    entries: [{time: "08:00", portion: 2}, {time: "18:00", portion: 1}].
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: asf02
clear_schedule:
  system: true
  is_advanced: true
  description: Remove all schedule entries.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: asf02
